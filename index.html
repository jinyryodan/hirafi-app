<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24104F">
<title>Rewixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E0F45;--violet:#5B2BD9;--violet-d:#2A1266;--violet-l:#EFE9FF;
  --gold:#FFB81C;--gold-d:#E39A00;--paper:#F7F5FF;--card:#fff;--line:#E7E1F8;
  --muted:#6C6788;--mint:#149B72;--mint-l:#E3F6EF;--coral:#E5484D;--coral-l:#FDECEC;
  --display:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper)}
body{color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,b.d{font-family:var(--display);margin:0;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
p{margin:0}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}

/* screens */
.screen{display:none;padding:calc(var(--safe-t) + 6px) 18px calc(96px + var(--safe-b))}
.screen.on{display:block}
.screen.plain{padding-bottom:calc(28px + var(--safe-b))}
.bar{display:flex;align-items:center;gap:12px;min-height:58px;margin-bottom:6px}
.bar h1{font-size:23px;flex:1;line-height:1.15}
.bar.brand img{width:34px;height:34px;border-radius:9px}
.bar.brand h1{font-size:21px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.iconbtn svg{width:22px;height:22px}
h2.sec{font-size:17px;margin:26px 0 12px}
h2.sec small{font:500 13px var(--body);color:var(--muted);margin-left:6px}

/* buttons */
.btn{width:100%;min-height:52px;border-radius:16px;font:700 15px var(--display);padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--violet);color:#fff}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.soft{background:var(--violet-l);color:var(--violet)}
.btn.ghost{background:transparent;color:var(--violet);border:1.5px solid var(--line)}
.btn.danger{background:var(--coral);color:#fff}
.btn.sm{width:auto;min-height:40px;border-radius:12px;font-size:13px;padding:0 16px}
.link{color:var(--violet);font-weight:700}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.card + .card{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font:700 12px var(--body);background:var(--violet-l);color:var(--violet)}
.pill.mint{background:var(--mint-l);color:var(--mint)}
.pill.gold{background:#FFF1CC;color:#8A5A00}
.pill.coral{background:var(--coral-l);color:var(--coral)}
.track{height:8px;border-radius:99px;background:var(--violet-l);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.empty{text-align:center;padding:30px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 16px var(--display);margin-bottom:4px}

/* hero balance */
.hero{background:var(--violet-d);color:#fff;border-radius:28px;padding:22px 22px 20px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;border:26px solid rgba(255,184,28,.16)}
.hero .lbl{color:#CFC3F5;font-size:14px}
.bal{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.bal img{width:46px;height:46px}
.bal b{font:800 46px/1 var(--display);letter-spacing:-.03em}
.goal{font-size:14px;color:#E6DEFF;margin-bottom:9px}
.goal b{color:#fff}
.hero .track{background:rgba(255,255,255,.16)}

/* streak strip */
.dots{display:flex;gap:7px;margin:12px 0 14px}
.dots i{flex:1;height:34px;border-radius:11px;background:var(--violet-l);display:grid;place-items:center;color:#fff;font:700 12px var(--display)}
.dots i.on{background:var(--gold);color:var(--ink)}
.dots i.now{outline:2px dashed var(--gold);outline-offset:2px;color:var(--gold-d)}
.flame{width:22px;height:22px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px}
.tile .ic{width:40px;height:40px;border-radius:13px;background:var(--violet-l);color:var(--violet);display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile b{font:700 15px var(--display);display:block}
.tile span{font-size:13px;color:var(--muted)}

/* lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.item + .item{border-top:1px solid var(--line)}
.item .ic{width:40px;height:40px;border-radius:13px;background:var(--violet-l);color:var(--violet);display:grid;place-items:center;flex:none}
.item .ic svg{width:21px;height:21px}
.item .ic img{width:30px;height:30px}
.item b{display:block;font-weight:700}
.item small{color:var(--muted);font-size:13px;display:block}
.amt{font:700 15px var(--display);white-space:nowrap}
.amt.pos{color:var(--mint)}.amt.neg{color:var(--coral)}
.chev{width:20px;height:20px;color:#A59FC0;flex:none}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);display:none;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b));z-index:20}
.nav.on{display:grid}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 4px;color:#8A85A3;font-size:11.5px;font-weight:500;position:relative}
.nav button.on{color:var(--violet);font-weight:700}
.nav button.on::before{content:'';position:absolute;top:-7px;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--gold)}
.nav svg{width:24px;height:24px}

/* auth */
#splash{background:var(--violet-d);min-height:100vh;min-height:100dvh;padding:0;place-items:center}
#splash.on{display:grid}
#splash img{width:132px;height:132px;border-radius:32px;animation:pop .7s cubic-bezier(.2,1.2,.3,1) both}
#auth{padding-bottom:40px}
.auth-top{text-align:center;padding:26px 0 18px}
.auth-top img{width:92px;height:92px;border-radius:24px}
.auth-top h1{font-size:26px;margin:14px 0 4px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--violet-l);border-radius:16px;padding:4px;margin:6px 0 18px}
.tabs button{min-height:44px;border-radius:12px;font:700 14px var(--display);color:var(--muted)}
.tabs button.on{background:#fff;color:var(--violet);box-shadow:0 1px 4px rgba(30,15,69,.12)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
.field .in{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.field .in:focus-within{border-color:var(--violet)}
.field input{flex:1;min-width:0;border:0;background:none;padding:14px;outline:none}
.field .in button{padding:0 14px;font-weight:700;font-size:13px;color:var(--violet)}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.err{background:var(--coral-l);color:#B3262B;border-radius:12px;padding:11px 14px;font-size:14px;margin-bottom:14px}
.ok{background:var(--mint-l);color:#0C6E51;border-radius:12px;padding:11px 14px;font-size:14px;margin-bottom:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);margin:4px 0 16px}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--violet);flex:none}

/* wheel */
.wheel{position:relative;width:min(84vw,330px);aspect-ratio:1;margin:26px auto 8px}
.wheel-rot{width:100%;height:100%;transition:transform 4.6s cubic-bezier(.12,.68,.13,1);filter:drop-shadow(0 10px 18px rgba(42,18,102,.28))}
.wheel-rot svg{width:100%;height:100%;display:block}
.hub{position:absolute;inset:0;margin:auto;width:17%;aspect-ratio:1;border-radius:50%;background:var(--gold);border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);display:grid;place-items:center}
.hub img{width:62%}
.pointer{position:absolute;left:50%;top:-16px;width:36px;transform:translateX(-50%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
.spinmeta{display:flex;justify-content:center;gap:8px;margin:18px 0 16px}

/* scratch */
.scratch{position:relative;aspect-ratio:5/3;border-radius:24px;overflow:hidden;background:var(--violet-d);color:#fff;display:grid;place-items:center;text-align:center}
.scratch .prize b{display:block;font:800 54px/1 var(--display);color:var(--gold)}
.scratch .prize span{color:#DCD2FF}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .5s}
.scratch canvas.gone{opacity:0;pointer-events:none}
.scratch .idle{padding:20px}
.scratch .idle b{font:700 18px var(--display);display:block;margin-bottom:4px}

/* reward */
.reward{display:flex;gap:14px;align-items:center}
.reward img{width:54px;height:54px;flex:none}
.reward .cost{font:700 14px var(--display);color:var(--violet)}

/* sheet, toast, confetti */
.scrim{position:fixed;inset:0;background:rgba(30,15,69,.5);display:none;z-index:50;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:#fff;width:min(100%,520px);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + var(--safe-b));max-height:88vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet h2{font-size:20px;margin-bottom:10px}
.sheet p{color:var(--muted);margin-bottom:12px}
.sheet .btn{margin-top:8px}
.sheet h3{font-size:15px;margin:14px 0 4px}
.win{text-align:center;padding:8px 0 10px}
.win b{display:block;font:800 60px/1.05 var(--display);color:var(--violet)}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:500;font-size:14px;max-width:min(92vw,440px);text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:80}
.toast.on{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

<section id="splash" class="screen"><img data-img="logo" alt="Rewixa"></section>

<section id="auth" class="screen">
  <div class="auth-top"><img data-img="logo" alt=""><h1>Welcome to Rewixa</h1><p class="muted">Play, collect points, unlock rewards.</p></div>
  <div class="tabs" role="tablist">
    <button id="tabIn" class="on" onclick="authMode('in')">Sign in</button>
    <button id="tabUp" onclick="authMode('up')">Create account</button>
  </div>
  <div id="authMsg"></div>
  <div class="field" id="fName" hidden><label for="aName">Name</label><div class="in"><input id="aName" autocomplete="name" placeholder="Your name" maxlength="40"></div></div>
  <div class="field"><label for="aEmail">Email</label><div class="in"><input id="aEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"></div></div>
  <div class="field"><label for="aPass">Password</label><div class="in"><input id="aPass" type="password" autocomplete="current-password" placeholder="At least 8 characters"><button type="button" onclick="togglePass()" id="passBtn">Show</button></div></div>
  <div class="field" id="fInvite" hidden><label for="aInvite">Invite code <span class="muted">(optional)</span></label><div class="in"><input id="aInvite" autocapitalize="characters" placeholder="RWXXXXXX" maxlength="12"></div></div>
  <label class="check" id="fTerms" hidden><input type="checkbox" id="aTerms"><span>I agree to the <a class="link" href="#" onclick="legal();return false">Terms and Privacy Policy</a>.</span></label>
  <button class="btn primary" id="authBtn" onclick="submitAuth()">Sign in</button>
  <p style="text-align:center;margin-top:16px" id="forgotRow"><button class="link" onclick="forgot()">Forgot your password?</button></p>
</section>

<section id="home" class="screen"></section>
<section id="earn" class="screen"></section>

<section id="spin" class="screen">
  <div class="bar"><h1>Spin the wheel</h1></div>
  <p class="muted" id="spinSub"></p>
  <div class="wheel"><div class="wheel-rot" id="wheelRot"></div><div class="hub"><img data-img="coin" alt=""></div>
    <svg class="pointer" viewBox="0 0 40 48" aria-hidden="true"><path d="M20 46 5 18a17 17 0 1 1 30 0z" fill="#FFB81C" stroke="#1E0F45" stroke-width="3" stroke-linejoin="round"/><circle cx="20" cy="15" r="5" fill="#1E0F45"/></svg></div>
  <div class="spinmeta" id="spinMeta"></div>
  <button class="btn gold" id="spinBtn" onclick="doSpin()">Spin</button>
  <p class="hint" style="text-align:center;margin-top:12px">Spins refill every day at 00:00 UTC.</p>
</section>

<section id="scratch" class="screen"></section>
<section id="rewards" class="screen"></section>
<section id="offers" class="screen"></section>
<section id="invite" class="screen"></section>
<section id="profile" class="screen"></section>
<section id="activity" class="screen"></section>
<section id="settings" class="screen"></section>
<section id="help" class="screen"></section>

<nav class="nav" id="nav" aria-label="Main"></nav>
</div>

<div class="scrim" id="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

let toastT;
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>x.classList.remove('on'),2800)}
function openSheet(h){$('#sheet').innerHTML=h;$('#scrim').classList.add('on')}
function closeSheet(){$('#scrim').classList.remove('on')}
function celebrate(n=40){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const w=document.createElement('div');w.className='confetti';
  const cols=['#FFB81C','#5B2BD9','#FF5C7A','#149B72','#7C4DFF'];
  for(let i=0;i<n;i++){const s=document.createElement('i');s.style.cssText=`left:${Math.random()*100}%;background:${cols[i%5]};animation-delay:${Math.random()*.5}s;--dx:${(Math.random()-.5)*180}px;--r:${Math.random()*720}deg`;w.appendChild(s)}
  document.body.appendChild(w);setTimeout(()=>w.remove(),3000);
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(_){return false}
  }
}

const ERR={already_claimed:'Already claimed. Come back tomorrow.',no_spins:'No spins left today. They refill at 00:00 UTC.',no_scratches:'No scratch card left today. A new one arrives at 00:00 UTC.',
not_enough_points:'You need more points for this reward.',unavailable:'This is not available right now.',invalid_code:'That code is not valid.',expired:'That code has expired.',
limit_reached:'That code has reached its usage limit.',already_used:'You already used that code.',requirement_not_met:'Finish the challenge first.',
contact_required:'Enter an email or phone number for delivery.',not_authenticated:'Your session ended. Sign in again.'};
function errMsg(e){const m=(e&&e.message)||'';for(const k in ERR)if(m.includes(k))return ERR[k];
  if(/failed to fetch|network|load failed/i.test(m))return 'No connection. Check your internet and try again.';
  return 'Something went wrong. Try again in a moment.'}

/* ---------- Data ---------- */
if(!window.supabase){document.addEventListener('DOMContentLoaded',()=>{document.body.innerHTML='<div style="padding:40px 24px;text-align:center;font-family:sans-serif"><h2>No connection</h2><p>Rewixa needs internet. Check your connection and reopen the app.</p></div>'})}
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:store,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}):null;
let S={user:null,profile:null,rewards:[],offers:[],done:new Set(),claims:new Set(),reqs:[],ledger:[]};
async function rpc(n,a){const {data,error}=await sb.rpc(n,a||{});if(error)throw error;return data}
async function q(p){const {data,error}=await p;if(error)throw error;return data}
async function loadProfile(){S.profile=await q(sb.from('profiles').select('*').eq('id',S.user.id).single())}
async function loadAll(){
  const [p,rw,of,dn,cl,rq,lg]=await Promise.all([
    q(sb.from('profiles').select('*').eq('id',S.user.id).single()),
    q(sb.from('rewards').select('*').order('sort')),
    q(sb.from('offers').select('*').order('sort')),
    q(sb.from('offer_completions').select('offer_id')),
    q(sb.from('mission_claims').select('mission')),
    q(sb.from('redemptions').select('*').order('created_at',{ascending:false}).limit(20)),
    q(sb.from('ledger').select('*').order('created_at',{ascending:false}).limit(40))]);
  S.profile=p;S.rewards=rw;S.offers=of;S.done=new Set(dn.map(x=>x.offer_id));S.claims=new Set(cl.map(x=>x.mission));S.reqs=rq;S.ledger=lg;
}
async function refresh(){await loadAll();renderCurrent()}

function why(r){if(WHY[r])return WHY[r];if(r.startsWith('streak_'))return r.split('_')[1]+'-day streak bonus';if(r.startsWith('mission:'))return 'Challenge completed';

const dshort=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function nextReward(){const p=S.profile;const list=S.rewards.slice().sort((a,b)=>a.cost-b.cost);if(!list.length)return null;return list.find(r=>r.cost>p.points)||list[0]}

const TABS=[['home','Home'],['earn','Earn'],['spin','Spin'],['rewards','Rewards'],['profile','Profile']];
const PARENT={scratch:'spin',offers:'earn',invite:'earn',activity:'profile',settings:'profile',help:'profile'};
let cur='splash';
function go(id){
  cur=id;document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(`#${id}`).classList.add('on');
  const inApp=id!=='splash'&&id!=='auth';$('#nav').classList.toggle('on',inApp);
  const tab=PARENT[id]||id;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  renderCurrent();window.scrollTo(0,0);

/* ---------- Wheel ---------- */
const WHEEL=[10,20,10,30,20,50,100,10,200,500];
function buildWheel(){
  const n=WHEEL.length,st=360/n,c=160,r=136;const pt=(a,d)=>{const t=(a-90)*Math.PI/180;return[c+d*Math.cos(t),c+d*Math.sin(t)]};
  let seg='',lab='',bulbs='';
  WHEEL.forEach((v,i)=>{
    const a=i*st,[x1,y1]=pt(a-st/2,r),[x2,y2]=pt(a+st/2,r),hi=v>=200,odd=i%2===1;
    const fill=hi?'#FF5C7A':odd?'#FFB81C':'#5B2BD9',tc=(odd&&!hi)?'#1E0F45':'#fff',[tx,ty]=pt(a,r*.7);
    seg+=`<path d="M${c} ${c}L${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z" fill="${fill}" stroke="#fff" stroke-width="2"/>`;
    lab+=`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" transform="rotate(${a} ${tx.toFixed(1)} ${ty.toFixed(1)})" text-anchor="middle" dominant-baseline="central" fill="${tc}" font-family="Sora,sans-serif" font-weight="800" font-size="${v>=100?23:21}">${v}</text>`;
  });
  for(let i=0;i<20;i++){const [x,y]=pt(i*18,147);bulbs+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" fill="${i%2?'#fff':'#FFB81C'}"/>`}
  $('#wheelRot').innerHTML=`<svg viewBox="0 0 320 320"><circle cx="160" cy="160" r="156" fill="#2A1266"/><circle cx="160" cy="160" r="152" fill="none" stroke="#FFB81C" stroke-width="2"/>${bulbs}${seg}${lab}</svg>`;
}
let rot=0,spinning=false;
async function doSpin(){
  if(spinning)return;const p=S.profile;if(spinsLeft(p)<=0)return toast(ERR.no_spins);
  spinning=true;$('#spinBtn').disabled=true;
  try{
    const r=await rpc('spin'),prize=r.prize;
    const idx=WHEEL.map((v,i)=>v===prize?i:-1).filter(i=>i>=0),i=idx[Math.floor(Math.random()*idx.length)];
    const base=Math.ceil(rot/360)*360;rot=base+2160-i*(360/WHEEL.length)+(Math.random()-.5)*20;
    $('#wheelRot').style.transform=`rotate(${rot}deg)`;
    await sleep(4800);vibrate([20,40,20]);await loadAll();
    celebrate(prize>=100?70:26);
    openSheet(`<div class="win"><p>You won</p><b>+${prize}</b><p>points</p></div><button class="btn primary" onclick="closeSheet()">Great</button>`);
  }catch(e){toast(errMsg(e))}
  spinning=false;renderCurrent();
}

function drawScratch(prize){
  const box=$('#scratchBox');
  box.innerHTML=`<div class="prize"><span>You won</span><b>+${prize}</b><span>points</span></div><canvas id="sc" width="600" height="360" aria-label="Scratch to reveal"></canvas>`;
  const c=$('#sc'),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,600,360);g.addColorStop(0,'#C9BFEA');g.addColorStop(.5,'#F3EFFF');g.addColorStop(1,'#B7ABD8');
  x.fillStyle=g;x.fillRect(0,0,600,360);x.fillStyle='rgba(91,43,217,.45)';x.font='800 40px Sora,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('Scratch here',300,180);
  let down=false,done=false;
  const at=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*360/r.height]};
  const dot=e=>{const [a,b]=at(e);x.globalCompositeOperation='destination-out';x.beginPath();x.arc(a,b,34,0,7);x.fill()};
  const check=()=>{if(done)return;const d=x.getImageData(0,0,600,360).data;let n=0,k=0;for(let i=3;i<d.length;i+=4*61){n++;if(d[i]<30)k++}
    if(k/n>.45){done=true;c.classList.add('gone');vibrate(30);celebrate(scratchPrize>=20?50:20);scratchPrize=null;R.scratch(false,true)}};
  c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);dot(e)};
  c.onpointermove=e=>{if(down)dot(e)};
  c.onpointerup=c.onpointercancel=()=>{down=false;check()};
}

  <div class="item"><div class="grow"><b>They claim their first daily reward</b><small>This confirms a real player joined.</small></div></div>
  <div class="item"><div class="grow"><b>You both get 300 points</b><small>Added to both balances automatically.</small></div></div></div>
  ${p.invited_by?'<p class="hint" style="margin-top:12px">You joined with a friend\'s invite code.</p>':''}`;
};

R.profile=()=>{const p=S.profile;
  $('#profile').innerHTML=`${bar('Profile')}
  <div class="card row"><div style="width:58px;height:58px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font:800 24px var(--display)">${esc((p.name||'P').trim().charAt(0).toUpperCase())}</div>
  <div class="grow"><b class="d" style="font-size:18px">${esc(p.name)}</b><p class="muted" style="overflow:hidden;text-overflow:ellipsis">${esc(S.user.email)}</p></div></div>
  <div class="tiles"><div class="tile"><b>${fmt(p.lifetime)}</b><span>Points earned</span></div><div class="tile"><b>${p.best_streak}</b><span>Best streak (days)</span></div></div>
  <h2 class="sec">Account</h2>
  <div class="list">
   <button class="item" onclick="go('activity')"><span class="ic">${ic('list')}</span><div class="grow"><b>Activity</b></div>${ic('chev','chev')}</button>
   <button class="item" onclick="go('settings')"><span class="ic">${ic('sliders')}</span><div class="grow"><b>Settings</b></div>${ic('chev','chev')}</button>
   <button class="item" onclick="go('help')"><span class="ic">${ic('help')}</span><div class="grow"><b>Help and support</b></div>${ic('chev','chev')}</button>
   <button class="item" onclick="legal()"><span class="ic">${ic('doc')}</span><div class="grow"><b>Terms and privacy</b></div>${ic('chev','chev')}</button>
   <button class="item" onclick="logout()"><span class="ic">${ic('out')}</span><div class="grow"><b>Sign out</b></div></button>
  </div><p class="hint" style="text-align:center;margin-top:16px">Rewixa 1.0</p>`;
};

R.activity=()=>{$('#activity').innerHTML=`${bar('Activity','profile')}${S.ledger.length?`<div class="list">${S.ledger.map(actItem).join('')}</div>`:`<div class="card empty"><b>Nothing yet</b>Your points history shows up here.</div>`}`};

R.settings=()=>{const p=S.profile;
  $('#settings').innerHTML=`${bar('Settings','profile')}
  <div class="list">
   <button class="item" onclick="nameSheet()"><div class="grow"><b>Name</b><small>${esc(p.name)}</small></div>${ic('chev','chev')}</button>
   <div class="item"><div class="grow"><b>Email</b><small>${esc(S.user.email)}</small></div></div>
   <button class="item" onclick="passSheet()"><div class="grow"><b>Change password</b></div>${ic('chev','chev')}</button>
  </div>
  <h2 class="sec">Danger zone</h2>
  <button class="btn ghost" style="color:var(--coral);border-color:#F6C9CB" onclick="deleteSheet()">Delete my account</button>
  <p class="hint" style="margin-top:8px">Deleting removes your account, points and history for good.</p>`;
};

R.help=()=>{
  const faq=[['How do I earn points?','Claim your daily reward, spin the wheel, open your scratch card, finish challenges and offers, or invite friends.'],
  ['When do spins and scratch cards refill?','Every day at 00:00 UTC.'],['How long does a reward take?','Each request is reviewed by hand. Delivery can take a few days. You can follow the status in Rewards.'],
  ['Why did my streak restart?','The daily reward must be claimed every day. Missing a day restarts the streak.'],['Do points have cash value?','No. Points can only be redeemed for the rewards listed in the app.']];
  $('#help').innerHTML=`${bar('Help and support','profile')}
  <div class="list">${faq.map(f=>`<div class="item"><div class="grow"><b>${f[0]}</b><small style="margin-top:2px">${f[1]}</small></div></div>`).join('')}</div>
  <a class="btn primary" style="margin-top:16px;text-decoration:none" href="mailto:${SUPPORT_EMAIL}?subject=Rewixa%20support">Contact support</a>`;
};

/* ---------- Boot ---------- */
document.querySelectorAll('[data-img]').forEach(i=>i.src=IMG[i.dataset.img]);
buildWheel();authMode('in');
async function boot(){
  go('splash');if(!sb)return;
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.user){S.user=null;go('auth')}});
  const t0=Date.now();let ok=false;
  try{const {data}=await sb.auth.getSession();if(data.session){S.user=data.session.user;await loadAll();ok=true}}catch(e){}
  await sleep(Math.max(0,1100-(Date.now()-t0)));
  go(ok?'home':'auth');
}
boot();
</script>
</body>
</html>
